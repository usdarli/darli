name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly stress on seeds the release configuration never reaches
  workflow_dispatch:

# Actions are pinned to full commit SHAs; the version comment is the tag they were resolved from. Dependabot proposes
# bumps (.github/dependabot.yml) so the pins stay current without anyone editing a SHA by hand.
# Every job runs a Makefile target rather than its own command list, so CI and RELEASING.md cannot drift apart: they
# already had, with CI running the fuzzers at a tenth of the budget the release checklist required.

permissions:
  contents: read

jobs:
  smoke:
    # What AGENTS.md 3 asks of a contributor. The fuzzer budgets here are below the coverage-floor threshold on purpose
    # and the run says so in its output; the floors are asserted in `evidence`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: make smoke

  evidence:
    # Everything docs/RESULTS.md claims, at the configuration it claims it for. The producers have to share one
    # workspace because each rewrites only its own group of results/figures.json, and the closing `git diff` is what
    # makes the document unable to drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: make evidence

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: v1.5.1 }
      - run: make contracts

  stress:
    # Nightly only. The release configuration always runs seeds 0..29; this runs seeds nobody has run before, so a bug
    # that only a rarer sequence reaches has a chance of surfacing before a reviewer does. The offset is derived from
    # the run number, so it advances on its own and a failure is reproducible from the log.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: long fuzz campaign on unseen seeds
        run: |
          OFFSET=$(( 1000 + ${{ github.run_number }} * 100 ))
          echo "first seed: $OFFSET (reproduce with the same argument)"
          cd model
          python3 fuzz.py 60 500 "$OFFSET"
          python3 fuzz_oracle.py 400 300 "$OFFSET"

  analysis:
    # Advisory only: Slither's findings on a skeleton are mostly informational, and a static analyser must never be the
    # thing that decides whether this repository is releasable -- RELEASING.md does that. It runs so that a new finding
    # is visible in the log, and it is read, not obeyed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        continue-on-error: true
        with:
          target: contracts/
          slither-args: --exclude-dependencies --filter-paths "lib/"
          fail-on: none
