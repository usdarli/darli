name: ci
on: [push, pull_request]
# Actions are pinned to full commit SHAs (resolved from GitHub on 2026-09-22); the version comment is the tag they were resolved from.
jobs:
  model:
    # Fast smoke check. The fuzzer sizes here are below the coverage-floor budget on purpose and the run says so in its
    # output; the floors are asserted in `evidence`, which runs the configuration docs/RESULTS.md records.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: scenarios, simulator, fuzzers
        run: |
          cd model
          python3 test_scenarios.py
          python3 test_econ_sim.py
          python3 fuzz.py 10 200
          python3 fuzz_oracle.py 50 100
      - name: specification mapping
        run: cd model && python3 spec_check.py

  evidence:
    # Everything docs/RESULTS.md claims, at the configuration it claims it for, in ONE job: the figure groups are merged
    # into a single results/figures.json, so every producer has to run in the same workspace. The final `git diff` is what
    # makes the document unable to drift -- it fails if a recorded figure, a hash or a submodule pin has moved and the
    # committed files were not regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: producers at the recorded configuration (coverage floors enforced here)
        run: |
          cd model
          python3 test_scenarios.py
          python3 test_econ_sim.py
          python3 fuzz.py 30 300
          python3 fuzz_oracle.py 200 150
      - name: every mutant must be killed (exit 1 on a survivor, an invalid mutant, or an empty run)
        run: cd model && python3 mutants.py
      - name: the document must match the runs, and the committed files must match the document
        run: |
          cd model
          python3 check_figures.py
          python3 check_manifest.py
          cd .. && git diff --exit-code -- model/results/figures.json docs/RESULTS.md

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with: { version: v1.5.1 }
      - name: differential vectors must be reproducible from the model
        run: |
          cd contracts
          python3 script/export_vectors.py ../model
          git diff --exit-code -- test/vectors
      - run: cd contracts && forge test -vv
