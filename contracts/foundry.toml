[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }]

# `make fork`: the tests that need Base itself (fork/), kept out of the offline gate
[profile.fork]
test = "fork"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 100
fail_on_revert = true # the handlers only make calls the contract must accept: any revert is a finding

[lint]
lint_on_build = false
